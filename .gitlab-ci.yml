stages:
  - publish

variables:
  PLUGIN_DIR: "plugins/litellm"

publish-plugin:
  stage: publish
  image: node:20-alpine
  tags:
    - k8s-runner-app
  only:
    - tags
  before_script:
    - apk add --no-cache git
  script:
    - cd $PLUGIN_DIR
    - echo "Publishing @trademe/plugin-litellm version ${CI_COMMIT_TAG}"
    - npm install --legacy-peer-deps
    - npm run build
    - npm publish
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - $PLUGIN_DIR/node_modules/
