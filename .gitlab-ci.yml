stages:
  - publish

variables:
  PLUGIN_DIR: "plugins/litellm"

publish-plugin:
  stage: publish
  image: node:20
  tags:
    - k8s-runner-app
  only:
    - tags
  before_script:
    - corepack enable
  script:
    - echo "Publishing @trademe/plugin-litellm version ${CI_COMMIT_TAG}"
    - yarn install
    - yarn tsc
    - yarn workspace @trademe/plugin-litellm build
    - echo "Configuring NPM authentication for GitLab registry"
    - echo "@trademe:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > ~/.npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> ~/.npmrc
    - cd $PLUGIN_DIR
    - npm publish
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .yarn/cache/
